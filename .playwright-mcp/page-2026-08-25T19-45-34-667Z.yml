        - generic [ref=f5e67]: Why We Exist
        - heading "We make objects that are not finished when they leave the workshop." [level=2] [ref=f5e68]
        - paragraph [ref=f5e323]: A piece of solid teak keeps changing long after it reaches your home — the grain deepens, the surface catches light differently with each year of use. We build for that slow change, not against it.
        - paragraph [ref=f5e324]: This is a small family workshop in India, run by the same hands for three generations. We make fewer things, more carefully, and we are in no hurry to make more.
