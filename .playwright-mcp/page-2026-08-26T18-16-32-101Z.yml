      - generic [ref=f8e106]:
        - img "Close-up of hand-cut joinery on a solid teak furniture piece." [ref=f8e108]
        - generic [ref=f8e109]:
          - generic [ref=f8e110]: Craftsmanship
          - heading "Every piece passes through one pair of hands, start to finish." [level=2] [ref=f8e111]
          - paragraph [ref=f8e112]: We work in solid timber, never veneer or particleboard. A single block is selected, dried, and left to settle before a tool ever touches it — rushing this step is the most common way a piece fails early.
          - paragraph [ref=f8e113]: Joints are cut by hand and fitted dry before any finish is applied. The oil we use is food-safe and reapplied over the piece’s life, not sealed under lacquer that traps moisture and cracks.
