          - heading "Cleaning" [level=3] [ref=f4e177]
          - paragraph [ref=f4e178]: Wipe with a soft, damp cloth. Avoid abrasive cleaners or harsh chemicals that may damage the oil finish.
        - generic [ref=f4e179]:
          - heading "Moisture" [level=3] [ref=f4e183]
          - paragraph [ref=f4e184]: Blot spills immediately. Teak is naturally moisture-resistant, but prolonged exposure may affect the finish.
        - generic [ref=f4e185]:
          - heading "Sunlight" [level=3] [ref=f4e192]
          - paragraph [ref=f4e193]: Avoid placing in direct, prolonged sunlight. UV exposure may cause the wood to lighten or the finish to dry.
        - generic [ref=f4e194]:
          - heading "Storage" [level=3] [ref=f4e198]
