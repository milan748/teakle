    - generic [ref=f4e201]:
      - generic [ref=f4e202]:
        - button "Our Craft — Story, Materials & Care +" [ref=f4e203] [cursor=pointer]
        - generic [ref=f4e204]:
          - heading [level=4] [ref=f4e205]: The Story
          - paragraph [ref=f4e206]: The Anchor Table began as a single teak log, selected from a managed plantation in southern India. The wood was left to settle in the workshop for several weeks before any cutting began. Each joint is cut by hand — mortise and tenon, locked without metal. The grain runs the full length of the top, unbroken, a record of the tree's growth.
          - heading [level=4] [ref=f4e207]: Craftsmanship
          - paragraph [ref=f4e208]: Every joint is hand-cut using traditional mortise and tenon joinery. No metal fasteners, no screws — just wood meeting wood, as it has for centuries. The surface is planed by hand, not sanded, to preserve the grain's natural lustre. Multiple thin coats of food-safe oil are worked in by hand, each allowed to cure before the next.
          - heading [level=4] [ref=f4e209]: Materials
          - paragraph [ref=f4e210]: Solid plantation teak, harvested sustainably from managed forests in southern India. Teak is naturally resistant to moisture and insects, making it ideal for dining furniture that will see daily use. The oil finish is food-safe and non-toxic.
          - heading [level=4] [ref=f4e211]: Care Instructions
          - paragraph [ref=f4e212]: Wipe with a damp cloth. Avoid harsh chemicals. Reapply food-safe oil every 12–18 months to maintain the surface. Small scratches can be buffed out with fine steel wool (0000 grade) followed by a coat of oil. Keep away from direct heat sources.
