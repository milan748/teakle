        - button "Our Craft — Story, Materials & Care +" [ref=f22e193] [cursor=pointer]
        - generic [ref=f22e194]:
          - heading [level=4] [ref=f22e195]: The Story
          - paragraph [ref=f22e196]: The Bearing Chair started as an experiment in single-block furniture. A craftsman took one solid piece of teak and carved away everything that wasn't a chair. What remains is a seamless form — seat, legs, and back flowing from one continuous surface.
          - heading [level=4] [ref=f22e197]: Craftsmanship
          - paragraph [ref=f22e198]: Each chair is carved from a single timber block using traditional hand tools. The seat is shaped with adzes and chisels, then smoothed with hand planes. No joints, no glue, no fasteners — just one piece of wood, shaped by hand.
          - heading [level=4] [ref=f22e199]: Materials
          - paragraph [ref=f22e200]: Solid plantation teak, selected for grain direction and density. The wood is naturally resistant to wear and moisture.
          - heading [level=4] [ref=f22e201]: Care Instructions
          - paragraph [ref=f22e202]: Dust regularly with a soft cloth. Clean with a damp cloth as needed. Apply oil annually to maintain the finish.
