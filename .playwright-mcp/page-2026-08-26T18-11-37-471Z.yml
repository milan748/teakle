        - generic [ref=f4e55]:
          - paragraph [ref=f4e56]: Walk into any furniture showroom and you'll see the phrase "solid wood" applied to everything from $200 nightstands to $20,000 dining tables. The label has become so overused that it's lost almost all meaning. Most of what it describes is veneer — a thin layer of real wood glued over particleboard or MDF.
          - paragraph [ref=f4e57]: There's nothing inherently wrong with veneer. It's a perfectly valid material, and in some applications it makes sense. But when a piece is marketed as "solid wood" and it's actually veneer, the customer is being misled about what they're buying — and more importantly, how the piece will age.
          - heading "What solid wood actually is" [level=2] [ref=f4e58]
          - paragraph [ref=f4e59]: Solid wood means the entire piece — or at least every structural component — is cut from real timber. Not a thin layer over engineered wood. Not a laminate with a wood-grain print. The wood goes all the way through.
          - paragraph [ref=f4e60]: When you run your finger along the edge of a solid wood board, you feel the same grain pattern on the edge as you do on the face. That's because it's the same piece of wood. With veneer, the edge often reveals a different material underneath — particleboard, MDF, or plywood.
          - heading "Why it matters after five years" [level=2] [ref=f4e61]
          - paragraph [ref=f4e62]: On day one, a well-made veneer piece and a solid wood piece can look identical. The difference emerges over time. Solid wood develops a patina — it darkens slightly, the grain becomes more pronounced, and small marks from daily use blend into the surface rather than revealing a different material underneath.
          - paragraph [ref=f4e63]: Veneer, by contrast, wears through. The thin layer — typically 0.5 to 1mm — can be scratched, chipped, or worn away, exposing the engineered material below. Once that happens, there's no way to repair it. The piece can't be sanded down and refinished because there's nothing underneath to refinish.
          - heading "How to tell the difference" [level=2] [ref=f4e64]
          - paragraph [ref=f4e65]: The simplest test is to look at the edges and underside. Solid wood will show consistent grain patterns on all surfaces. Veneer will often show a seam where the thin layer meets the edge, or a different material entirely on the underside.
          - paragraph [ref=f4e66]: Weight is another indicator. Solid teak is dense — a solid wood dining table will be significantly heavier than a veneered one of the same size. If a large piece feels surprisingly light, it's likely engineered wood inside.
          - paragraph [ref=f4e67]: Ask about the construction. A maker who works in solid wood will know exactly which boards went into a piece, where the timber came from, and how it was dried. A manufacturer using veneer often can't answer those questions because the materials are sourced commodity items.
          - paragraph [ref=f4e68]: At Teakle, every piece is solid teak — not because we're making a statement, but because that's how wood is supposed to work. The grain runs through, the joints are cut to fit, and the surface is finished to age gracefully over decades, not just look good on delivery day.
