    - generic [ref=f26e164]:
      - generic [ref=f26e165]:
        - button "Our Craft — Story, Materials & Care +" [ref=f26e166] [cursor=pointer]
        - generic [ref=f26e167]:
          - heading [level=4] [ref=f26e168]: The Story
          - paragraph [ref=f26e169]: The Bearing Chair started as an experiment in single-block furniture. A craftsman took one solid piece of teak and carved away everything that wasn't a chair. What remains is a seamless form — seat, legs, and back flowing from one continuous surface.
          - heading [level=4] [ref=f26e170]: Craftsmanship
          - paragraph [ref=f26e171]: Each chair is carved from a single timber block using traditional hand tools. The seat is shaped with adzes and chisels, then smoothed with hand planes. No joints, no glue, no fasteners — just one piece of wood, shaped by hand.
          - heading [level=4] [ref=f26e172]: Materials
          - paragraph [ref=f26e173]: Solid plantation teak, selected for grain direction and density. The wood is naturally resistant to wear and moisture.
          - heading [level=4] [ref=f26e174]: Care Instructions
          - paragraph [ref=f26e175]: Dust regularly with a soft cloth. Clean with a damp cloth as needed. Apply oil annually to maintain the finish.
