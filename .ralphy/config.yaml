project:
  name: "teakle"
  language: "JavaScript"
  framework: "Next.js"
  description: "Teakle Atelier luxury teakwood home decor website"

commands:
  test: ""
  lint: ""
  build: "npm run build"

capabilities:
  browser: "true"

rules:
  - "Use OpenCode as the implementation engine."
  - "The task source is TEAKLE_TASKS.yaml when invoked with --yaml."
  - "Execute only the current assigned task. Do not independently redesign the entire website."
  - "Work on the existing Teakle website. Do not rebuild it from scratch."
  - "Read TEAKLE/TEAKLE_HANDBOOK.md and TEAKLE_AUTOPILOT.md before implementation."
  - "Inspect the rendered website before making visual changes."
  - "Use agent-browser for browser inspection and screenshots when available."
  - "Use the existing verified implementation as the baseline."
  - "Make small, focused, reversible improvements."
  - "Do not refactor unrelated code."
  - "After a visual change, render the website again and verify the result."
  - "Preserve existing routes and navigation."
  - "Preserve ecommerce functionality, wishlist, account, cart, and add-to-cart functionality."
  - "Do not remove product grids or horizontal product carousels."
  - "Do not remove mobile bottom navigation."
  - "Use Instrument Sans as the website typeface."
  - "Do not introduce decorative, serif, script, novelty, or unrelated fonts."
  - "Preserve the established Teakle brand palette and visual identity."
  - "Use the existing Teakle logo asset."
  - "Never redraw, reinterpret, replace, stretch, distort, or fabricate the logo."
  - "Do not invent products, prices, specifications, dimensions, availability, testimonials, or brand facts."
  - "Prefer authentic Teakle product imagery already present in the repository."
  - "Do not introduce unrelated stock imagery merely to fill empty space."
  - "Major editorial imagery should favor landscape or cinematic compositions."
  - "Use extreme-left, extreme-right, full-bleed, or wide cinematic image compositions where appropriate."
  - "Avoid narrow centered text blocks when a wider editorial composition is more appropriate."
  - "Avoid excessive empty vertical space that does not serve the composition."
  - "Do not turn the website into a SaaS dashboard, marketplace, or card-heavy interface."
  - "Do not introduce excessive rounded cards, heavy shadows, gradients, badges, or decorative UI."
  - "Luxury should come from proportion, typography, photography, materiality, contrast, composition, and spacing."
  - "Keep commerce visually quiet but functional."
  - "Do not remove prices or purchase controls merely to make the site appear luxurious."
  - "Do not modify Shopify, backend, database, authentication, CMS architecture, or business logic unless a verified content-integrity defect specifically requires tracing its source."
  - "Do not change product data structure unless a verified content-integrity problem requires it."
  - "Check responsive behavior, especially mobile navigation and layout."
  - "Check browser console/runtime errors when practical."
  - "Run npm run build after meaningful implementation changes."
  - "If a proposed change could alter established functionality, investigate before implementing it."
  - "Do not modify TEAKLE/TEAKLE_HANDBOOK.md."
  - "Do not modify TEAKLE_AUTOPILOT.md during website implementation."
  - "If the current task is already satisfied, do not create artificial work."
  - "Do not make unrelated changes merely to create progress."
  - "Never expose secrets, credentials, API keys, or environment variables."
  - "Git commits are conditional on Git being available."
  - "Never claim that a commit was created when Git is unavailable."
  - "Do not push to a remote repository."

boundaries:
  never_touch:
    - ".env"
    - ".env.*"
    - "node_modules/**"
    - ".next/**"
    - ".git/**"
